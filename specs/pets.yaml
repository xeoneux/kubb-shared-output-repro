openapi: 3.0.3
info:
  title: Pets
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPage'
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  # getHealth is in pets and shop, on a different path in each.
  /pets/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
components:
  schemas:
    # In all 3 specs, identical
    Name:
      type: string
      minLength: 1
    Color:
      type: string
      enum: [red, green, blue]
    # In all 3 specs, but shop.yaml has a different description
    Tag:
      type: string
      description: A tag.
    # In pets and shop only (2 of 3 specs), identical
    Address:
      type: object
      required: [street, city]
      properties:
        street:
          type: string
        city:
          type: string
    # In all 3 specs, identical. It uses Tag, so it isn't shared either, and the warning doesn't name it.
    Badge:
      type: object
      required: [tag]
      properties:
        tag:
          $ref: '#/components/schemas/Tag'
        name:
          $ref: '#/components/schemas/Name'
    Page:
      type: object
      required: [number, hasNext]
      properties:
        number:
          type: integer
          format: int32
        hasNext:
          type: boolean
    # Identical to shop.yaml, but here it's also part of the `Animal` discriminator
    Cat:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        indoor:
          type: boolean
    Dog:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        goodBoy:
          type: boolean
    Animal:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
    # Only in pets
    Pet:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/Name'
        color:
          $ref: '#/components/schemas/Color'
        home:
          $ref: '#/components/schemas/Address'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        animal:
          $ref: '#/components/schemas/Animal'
        weightGrams:
          type: integer
          format: int64
        nickname:
          type: string
          deprecated: true
    PetPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Pet'
