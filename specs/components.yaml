openapi: 3.0.3
info:
  title: Components
  version: 1.0.0
  description: A components-only spec, like a shared "common types" file. It has no endpoints.
paths: {}
components:
  schemas:
    Name:
      type: string
      minLength: 1
    Color:
      type: string
      enum: [red, green, blue]
    Tag:
      type: string
      description: A tag.
    # In all 3 specs, identical. It uses Tag, so it isn't shared either, and the warning doesn't name it.
    Badge:
      type: object
      required: [tag]
      properties:
        tag:
          $ref: '#/components/schemas/Tag'
        name:
          $ref: '#/components/schemas/Name'
    Page:
      type: object
      required: [number, hasNext]
      properties:
        number:
          type: integer
          format: int32
        hasNext:
          type: boolean
